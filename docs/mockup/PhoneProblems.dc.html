<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code Cafe: phone, problems</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#c45200} a:hover{color:#1a1612}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f5f2; display: flex; flex-direction: column; overflow: hidden; font-family: 'Archivo', system-ui, sans-serif; color: #1a1612;">
  <header style="height: 48px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px;">
    <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border: 0; background: none; color: #1a1612; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c45200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2M14 2v2M6 2v2"></path><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path></svg>
    <span style="font-size: 16px; font-weight: 600; margin-left: 6px; flex: 1;">Code Cafe</span>
    <button type="button" aria-label="Search problems" style="width: 44px; height: 44px; border: 0; background: none; color: #1a1612; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
  </header>
  <main style="flex: 1; background: #ffffff; border-top: 1px solid #ebe8e3; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em;">Problems</h1>
      <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.45; color: #615a52;">4 of 12 brewed. No dark roasts yet: Nth Fibonacci is the friendliest of the three (46.3%).</p>
    </div>
    <a href="#continue" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #1a1612; color: #ffffff; font-size: 15px; font-weight: 500; text-decoration: none;">Continue Balanced Brackets</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #ebe8e3; border-radius: 8px; overflow: hidden;">
      <sc-for list="{{counter}}" as="c" hint-placeholder-count="4">
        <div style="padding: 12px 14px; border-left: {{c.bl}}; border-top: {{c.bt}}; display: flex; flex-direction: column; gap: 6px;">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #615a52;"><span style="width: 8px; height: 12px; border-radius: 2px; background: {{c.swatch}};"></span>{{c.label}}</span>
          <span class="num" style="font-size: 14px; color: #615a52;"><span style="font-size: 22px; font-weight: 500; color: #1a1612;">{{c.a}}</span> of {{c.b}}</span>
          <span style="height: 4px; background: #f4f2ee; border-radius: 2px;"><span style="display: block; height: 4px; width: {{c.pct}}%; background: {{c.bar}}; border-radius: 2px;"></span></span>
        </div>
      </sc-for>
    </div>
    <div role="tablist" aria-label="Filter problems" style="display: flex; gap: 22px; border-bottom: 1px solid #ebe8e3; font-size: 14px;">
      <span role="tab" aria-selected="true" style="padding-bottom: 8px; border-bottom: 2px solid #c45200; font-weight: 500;">All <span style="color: #615a52; font-weight: 400;">12</span></span>
      <span role="tab" aria-selected="false" style="padding-bottom: 10px; color: #615a52;">To brew 8</span>
      <span role="tab" aria-selected="false" style="padding-bottom: 10px; color: #615a52;">Solved 4</span>
    </div>
    <ul style="list-style: none; margin: -6px 0 0; padding: 0;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f2f0ec;">
          <span aria-label="{{r.status}}" role="img" style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 999px; border: {{r.ring}}; background: {{r.fill}}; flex: none;"></span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px;"><span style="font-weight: 500;">{{r.name}}</span><span class="num">{{r.acc}}</span></span>
            <span style="display: block; font-size: 13px; color: #615a52; margin-top: 2px;">{{r.roast}} roast · {{r.best}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = [
      ['Sum of Two Numbers', 'Light', 92.4, 'Solved', '0.016 s'],
      ['Count the Vowels', 'Light', 88.1, 'Solved', '0.018 s'],
      ['Reverse a String', 'Medium', 81.7, 'Solved', '0.021 s'],
      ['Prime Sieve up to N', 'Light', 79.6, 'Solved', '0.142 s'],
      ['Second Largest in an Array', 'Light', 74.9, 'New', null],
      ['Balanced Brackets', 'Medium', 63.5, 'Attempted', null],
      ['Longest Common Prefix', 'Medium', 61.0, 'Attempted', null]
    ];
    var rows = P.map(function (p) {
      return {
        name: p[0], roast: p[1], acc: p[2].toFixed(1) + '%', status: p[3],
        best: p[4] ? 'your best ' + p[4] : (p[3] === 'Attempted' ? 'attempted, not solved' : 'not tried'),
        ring: p[3] === 'Solved' ? '0' : '1.5px solid ' + (p[3] === 'Attempted' ? '#615a52' : '#d4d0c9'),
        fill: p[3] === 'Solved' ? '#247b50' : 'transparent'
      };
    });
    var cells = [['All roasts', 4, 12, 'transparent', '#c45200'], ['Light roast', 3, 4, '#b3845a', '#b3845a'], ['Medium roast', 1, 5, '#8b5a2b', '#8b5a2b'], ['Dark roast', 0, 3, '#3b2414', '#3b2414']];
    var counter = cells.map(function (c, i) {
      return { label: c[0], a: c[1], b: c[2], swatch: c[3], bar: c[4], pct: Math.round(c[1] / c[2] * 100),
        bl: i % 2 ? '1px solid #ebe8e3' : '0', bt: i > 1 ? '1px solid #ebe8e3' : '0' };
    });
    return { rows: rows, counter: counter };
  }
}
</script>
</body>
</html>
